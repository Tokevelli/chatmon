version: "3.8"

services:
  # Existing ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: always
    networks:
      - elk_network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.10.2
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    restart: always
    networks:
      - elk_network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.2
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always
    networks:
      - elk_network

  # Adding Heartbeat
  heartbeat:
    image: docker.elastic.co/beats/heartbeat:7.10.2
    container_name: heartbeat
    user: root
    depends_on:
      - elasticsearch
    volumes:
      - ./heartbeat.yml:/usr/share/heartbeat/heartbeat.yml
    restart: always
    networks:
      - elk_network
   # command: ["heartbeat", "-e", "-c", "/usr/share/heartbeat/heartbeat.yml"]

  # Watchtower for container updates
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      - elk_network

networks:
  elk_network: {}

volumes:
  mysql_data: {}
